<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>BEmmy :: Emmy in the Browser</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="logo.pshift.png">

    <!-- Open Graph / social card. og:url and og:image need absolute
         URLs — update both before deploying to a public host. -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="BEmmy — Emmy in the Browser">
    <meta property="og:description" content="An interactive ClojureScript playground for SICM. Emmy computer algebra, symbolic differentiation, Lagrangian mechanics, 2D/3D visualization — no install required.">
    <meta property="og:image"       content="https://bathro.be/bemmy/logo.pshift.png">
    <meta property="og:url"         content="https://bathro.be/bemmy/">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="BEmmy — Emmy in the Browser">
    <meta name="twitter:description" content="An interactive ClojureScript playground for SICM. Emmy computer algebra, symbolic differentiation, Lagrangian mechanics, 2D/3D visualization — no install required.">
    <meta name="twitter:image"       content="https://bathro.be/bemmy/logo.pshift.png">

    <!-- All static deps are vendored into public/vendor/ via bin/vendor.sh
         so the page is self-hostable with no third-party CDN at runtime. -->

    <link rel="stylesheet" href="vendor/katex/katex.min.css">

    <!-- Mafs's plot styling. font.css imports a cmu-serif CSS we don't
         vendor; Mafs falls back to system serif which is fine. -->
    <link rel="stylesheet" href="vendor/mafs/core.css">

    <!-- highlight.js for syntax highlighting in the result pane.
         Two stylesheets, swapped via prefers-color-scheme. -->
    <link rel="stylesheet" media="(prefers-color-scheme: light)"
          href="vendor/hljs/github.min.css">
    <link rel="stylesheet" media="(prefers-color-scheme: dark)"
          href="vendor/hljs/github-dark.min.css">
    <script src="vendor/hljs/highlight.min.js"></script>
    <!-- Clojure isn't in hljs's "common" bundle; load it explicitly. -->
    <script src="vendor/hljs/clojure.min.js"></script>

    <!-- SICM (Scheme) → Emmy (Clojure) translator, exposes window.SicmToEmmy -->
    <script src="sicm2emmy.js"></script>

    <!-- pshift animated logo (canvas-based). Scripts must load before
         the Reagent app mounts so PshiftLoader is available when the
         logo component's component-did-mount fires. -->
    <script src="logo-engine-standalone.js"></script>
    <script src="pshift-png.js"></script>
    <script src="pshift-loader.js"></script>

    <!-- CodeMirror 6 + nextjournal/clojure-mode vendored locally under
         vendor/codemirror/ (generated by bin/vendor.sh via the Node.js
         dep-graph walker). The "codemirror" meta-package's basicSetup
         didn't survive esm.sh's wrapper, so we import the constituent
         @codemirror/* packages directly and compose our own setup. -->
    <script type="module">
      window.cm_ready = (async () => {
        const [view, state, commands, language, cljs, vim, oneDark] = await Promise.all([
          import("./vendor/codemirror/@codemirror/view@6.js"),
          import("./vendor/codemirror/@codemirror/state@6.js"),
          import("./vendor/codemirror/@codemirror/commands@6.js"),
          import("./vendor/codemirror/@codemirror/language@6.js"),
          import("./vendor/codemirror/@nextjournal/clojure-mode.js"),
          import("./vendor/codemirror/@replit/codemirror-vim.js"),
          import("./vendor/codemirror/@codemirror/theme-one-dark.js")
        ]);
        window.CM = {
          EditorView:          view.EditorView,
          EditorState:         state.EditorState,
          Prec:                state.Prec,
          keymap:              view.keymap,
          lineNumbers:         view.lineNumbers,
          drawSelection:       view.drawSelection,
          highlightActiveLine: view.highlightActiveLine,
          history:             commands.history,
          defaultKeymap:       commands.defaultKeymap,
          historyKeymap:       commands.historyKeymap,
          bracketMatching:     language.bracketMatching,
          syntaxHighlighting:  language.syntaxHighlighting,
          defaultHighlightStyle: language.defaultHighlightStyle,
          defaultExtensions:   cljs.default_extensions,
          completeKeymap:      cljs.complete_keymap,
          vim:                 vim.vim,
          oneDark:             oneDark.oneDark
        };
      })();
    </script>
    <style>
      :root {
        /* Light theme (default) */
        --bg:           #fafafa;
        --surface:      #ffffff;
        --surface-2:    #f6f8fa;
        --surface-3:    #eef1f4;
        --border:       #d0d7de;
        --border-soft:  #eaeef2;
        --text:         #1f2933;
        --text-muted:   #57606a;
        --err:          #b42318;

        --tab-bg:           #ffffff;
        --tab-bg-hover:     #f6f8fa;
        --tab-active-bg:    #ddeeff;
        --tab-active-fg:    #0969da;
        --tab-active-bd:    #b6dafc;

        --action-bg:        #1f883d;
        --action-bg-hover:  #1a7f37;
        --action-fg:        #ffffff;

        --header-bg:        #1f2933;
        --header-fg:        #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:           #0d1117;
          --surface:      #161b22;
          --surface-2:    #1c2129;
          --surface-3:    #21262d;
          --border:       #30363d;
          --border-soft:  #21262d;
          --text:         #e6edf3;
          --text-muted:   #8b949e;
          --err:          #ff7b72;

          --tab-bg:           #1c2129;
          --tab-bg-hover:     #21262d;
          --tab-active-bg:    #1f3a5c;
          --tab-active-fg:    #79c0ff;
          --tab-active-bd:    #1f6feb;

          --action-bg:        #238636;
          --action-bg-hover:  #2ea043;
          --action-fg:        #ffffff;

          --header-bg:        #161b22;
          --header-fg:        #e6edf3;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app { height: 100vh; display: flex; flex-direction: column; min-height: 0; }
      header {
        padding: 0.5rem 1rem;
        background: var(--header-bg);
        color: var(--header-fg);
        display: flex; justify-content: space-between; align-items: baseline;
      }
      header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
      header h1 canvas.logo-cycle { display: block; height: 28px; width: auto; }
      header .tagline { font-size: 0.75rem; opacity: 0.7; }
      .panes { flex: 1; display: flex; min-height: 0; }
      .pane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-left: 1px solid var(--border); }
      .pane > .label {
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--text-muted); background: var(--surface-3);
        border-bottom: 1px solid var(--border);
      }
      .cm-host, .result {
        flex: 1; min-height: 0; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px; line-height: 1.5;
      }
      .cm-host { background: var(--surface); }
      .cm-host .cm-editor { height: 100%; outline: none; }
      .cm-host .cm-editor.cm-focused { outline: none; }
      .cm-host .cm-content { padding: 0.75rem 1rem; color: var(--text); }
      .result { background: var(--surface); color: var(--text);
                white-space: pre-wrap; padding: 0.75rem 1rem; }
      .result .err { color: var(--err); }
      .result .tex { font-family: inherit; font-size: 1rem; }
      .result-row {
        padding: 0.4rem 0; border-bottom: 1px solid var(--border-soft);
      }
      .result-row:first-child { padding-top: 0; }
      .result-row:last-child  { padding-bottom: 0; border-bottom: 0; }
      .form-snippet, .pr {
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .form-snippet {
        font-size: 0.7rem; color: var(--text-muted); background: var(--surface-2);
        padding: 0.2rem 0.5rem; margin: 0 0 0.35rem 0;
        border-radius: 3px; white-space: pre-wrap; overflow-x: auto;
      }
      .result-row .pr { color: var(--text-muted); margin-top: 0.3rem; font-size: 13px; }
      .form-snippet .hljs, .pr .hljs { background: transparent; padding: 0; display: inline; }

      /* Inline visualization (Mafs etc.). Plot bg stays light so curves
         stay legible regardless of OS theme. */
      .viz {
        margin: 0.4rem 0; min-height: 240px; max-height: 60vh;
        overflow: hidden; border-radius: 4px; background: #ffffff;
      }
      .viz .MafsView { width: 100%; }

      .toolbar {
        padding: 0.5rem 0.75rem; border-top: 1px solid var(--border);
        display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;
        background: var(--surface-2);
      }

      /* Action button (Evaluate). Filled accent — clearly an action you press. */
      button.action {
        font: inherit; padding: 0.25rem 0.75rem; cursor: pointer;
        background: var(--action-bg); color: var(--action-fg);
        border: 0; border-radius: 4px;
      }
      button.action:hover { background: var(--action-bg-hover); }

      /* Generic clickable button (page tabs, +, shelf toggle).
         Outlined in the same blue used for the active state so all
         clickables read as belonging to one family — fill kicks in
         only when toggled on. */
      button.btn {
        font: inherit; padding: 0.15rem 0.55rem; cursor: pointer;
        background: var(--tab-bg); color: var(--text);
        border: 1px solid var(--tab-active-bd); border-radius: 4px;
        font-size: 0.75rem;
      }
      button.btn:hover { background: var(--tab-bg-hover); }
      button.btn.is-on {
        background: var(--tab-active-bg); color: var(--tab-active-fg);
      }

      /* Checkbox toggle (vim mode). True binary state, semantically a
         checkbox not a button. */
      label.check {
        display: inline-flex; align-items: center; gap: 0.35rem;
        font-size: 0.75rem; color: var(--text); cursor: pointer; user-select: none;
        padding: 0.15rem 0.25rem;
      }
      label.check input { margin: 0; cursor: pointer; }

      /* Float Share to the right of the toolbar. */
      .share-btn { margin-left: auto; }

      /* Ephemeral notification floated in the bottom-right corner. */
      .toast {
        position: fixed; right: 1rem; bottom: 1rem; z-index: 100;
        padding: 0.5rem 0.85rem;
        background: var(--header-bg); color: var(--header-fg);
        border-radius: 4px; font-size: 0.8rem;
        box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        animation: toast-in 0.18s ease-out;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);   }
      }

      kbd {
        font-family: ui-monospace, monospace; font-size: 0.75rem;
        padding: 1px 4px; border: 1px solid var(--border); border-radius: 3px;
        background: var(--surface-2); color: var(--text);
      }

      /* Page tabs */
      .pages {
        display: flex; flex-wrap: wrap; gap: 0.25rem; align-items: center;
        padding: 0.35rem 0.75rem;
        background: var(--surface-2); border-bottom: 1px solid var(--border);
      }
      .pages .page {
        display: inline-flex; align-items: center;
        padding: 0.1rem 0.5rem; font-size: 0.75rem;
        border: 1px solid var(--tab-active-bd); border-radius: 4px;
        background: var(--tab-bg); color: var(--text);
        user-select: none;
      }
      .pages .page:hover { background: var(--tab-bg-hover); }
      .pages .page.active {
        background: var(--tab-active-bg); color: var(--tab-active-fg);
        cursor: default;
      }
      .pages .page.active:hover { background: var(--tab-active-bg); }
      .pages .page-name { cursor: pointer; }
      .pages .page.active .page-name { cursor: default; }
      .pages .page-x {
        margin-left: 0.4rem; cursor: pointer; opacity: 0.55; font-weight: bold;
      }
      .pages .page-x:hover { opacity: 1; }
      .pages .page-add {
        padding: 0.1rem 0.55rem; font-size: 0.75rem;
        background: transparent; color: var(--tab-active-fg);
        border: 1px dashed var(--tab-active-bd); border-radius: 4px;
        cursor: pointer;
      }
      .pages .page-add:hover { background: var(--tab-bg-hover); }

      /* System pages dropdown — sits at the left of the page tabs row.
         Visually a .page tab; clicking opens a small menu. */
      .system-dropdown { position: relative; display: inline-block; }
      .system-menu {
        position: absolute; top: calc(100% + 4px); left: 0;
        min-width: 140px; z-index: 10;
        background: var(--surface); color: var(--text);
        border: 1px solid var(--tab-active-bd); border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        padding: 0.15rem 0;
      }
      .system-menu-item {
        padding: 0.25rem 0.65rem; font-size: 0.75rem; cursor: pointer;
        white-space: nowrap;
      }
      .system-menu-item:hover {
        background: var(--tab-bg-hover); color: var(--tab-active-fg);
      }

      /* SICM → Emmy translator shelf (sits above the toolbar) */
      .shelf {
        display: flex; flex-direction: column;
        flex: 0 1 auto; max-height: 50%; min-height: 0;
        border-top: 1px solid var(--border); background: var(--surface-2);
      }
      .shelf-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.4rem 0.75rem;
        background: var(--surface); border-bottom: 1px solid var(--border);
      }
      .shelf-title { font-size: 0.75rem; font-weight: 600; color: var(--text); }
      .shelf-close {
        background: none; border: 0; font-size: 1.25rem; line-height: 1;
        cursor: pointer; color: var(--text-muted); padding: 0 0.25rem;
      }
      .shelf-body { display: flex; flex: 1; min-height: 140px; }
      .shelf-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .shelf-pane + .shelf-pane { border-left: 1px solid var(--border); }
      .shelf-sublabel {
        padding: 0.2rem 0.6rem;
        font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--text-muted); background: var(--surface-3);
        border-bottom: 1px solid var(--border);
      }
      .shelf-textarea {
        flex: 1; min-height: 100px;
        border: 0; outline: none; padding: 0.5rem 0.75rem;
        font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px;
        line-height: 1.5; background: var(--surface); color: var(--text);
        resize: none; tab-size: 2;
      }
      .shelf-toolbar {
        display: flex; gap: 0.75rem; align-items: center;
        padding: 0.4rem 0.75rem;
        background: var(--surface); border-top: 1px solid var(--border);
      }
      .shelf-toolbar .hint { font-size: 0.7rem; color: var(--text-muted); }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- React must load before scittle.reagent (shadow externalizes it as a global) -->
    <script src="vendor/react/react.production.min.js"></script>
    <script src="vendor/react/react-dom.production.min.js"></script>
    <!-- Stock scittle + reagent + pprint built locally by `bb release` -->
    <script src="js/scittle.js"></script>
    <script src="js/scittle.pprint.js"></script>
    <script src="js/scittle.reagent.js"></script>
    <!-- Our custom plugin: Emmy in SCI -->
    <script src="js/scittle.emmy.js"></script>
    <!-- KaTeX for rendering Emmy's TeX output -->
    <script defer src="vendor/katex/katex.min.js"></script>

    <!-- Application code: the playground UI itself, evaluated by Scittle -->
    <script type="application/x-scittle" src="app.cljs"></script>
  </body>
</html>
