<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bemmy :: Emmy in the Browser</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" sizes="16x16"   href="favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32"   href="favicon-32.png">
    <link rel="apple-touch-icon"      sizes="180x180" href="apple-touch-icon.png">

    <!-- Open Graph / social card. og:url and og:image need absolute
         URLs — update both before deploying to a public host. -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Bemmy — Emmy in the Browser">
    <meta property="og:description" content="An interactive ClojureScript playground for SICM. Emmy computer algebra, symbolic differentiation, Lagrangian mechanics, 2D/3D visualization — no install required.">
    <meta property="og:image"       content="https://bathro.be/bemmy/bemmy.neonic.png">
    <meta property="og:url"         content="https://bathro.be/bemmy/">
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="Bemmy — Emmy in the Browser">
    <meta name="twitter:description" content="An interactive ClojureScript playground for SICM. Emmy computer algebra, symbolic differentiation, Lagrangian mechanics, 2D/3D visualization — no install required.">
    <meta name="twitter:image"       content="https://bathro.be/bemmy/bemmy.neonic.png">

    <!-- All static deps are vendored into public/vendor/ via bin/vendor.sh
         so the page is self-hostable with no third-party CDN at runtime. -->

    <link rel="stylesheet" href="vendor/katex/katex.min.css">

    <!-- Mafs's plot styling. font.css imports a cmu-serif CSS we don't
         vendor; Mafs falls back to system serif which is fine. -->
    <link rel="stylesheet" href="vendor/mafs/core.css">

    <!-- highlight.js for syntax highlighting in the result pane.
         Two stylesheets, swapped via prefers-color-scheme. -->
    <link rel="stylesheet" media="(prefers-color-scheme: light)"
          href="vendor/hljs/github.min.css">
    <link rel="stylesheet" media="(prefers-color-scheme: dark)"
          href="vendor/hljs/github-dark.min.css">
    <script src="vendor/hljs/highlight.min.js"></script>
    <!-- Clojure isn't in hljs's "common" bundle; load it explicitly. -->
    <script src="vendor/hljs/clojure.min.js"></script>

    <!-- SICM (Scheme) → Emmy (Clojure) translator, exposes window.SicmToEmmy -->
    <script src="sicm2emmy.js"></script>

    <!-- neonic animated logo (canvas-based). Scripts must load before
         the Reagent app mounts so NeonicLoader is available when the
         logo component's component-did-mount fires. -->
    <script src="neonic-playback.js"></script>

    <!-- CodeMirror 6 + nextjournal/clojure-mode vendored locally under
         vendor/codemirror/ (generated by bin/vendor.sh via the Node.js
         dep-graph walker). The "codemirror" meta-package's basicSetup
         didn't survive esm.sh's wrapper, so we import the constituent
         @codemirror/* packages directly and compose our own setup. -->
    <script type="module">
      window.cm_ready = (async () => {
        const [view, state, commands, language, cljs, vim, oneDark] = await Promise.all([
          import("./vendor/codemirror/@codemirror/view@6.js"),
          import("./vendor/codemirror/@codemirror/state@6.js"),
          import("./vendor/codemirror/@codemirror/commands@6.js"),
          import("./vendor/codemirror/@codemirror/language@6.js"),
          import("./vendor/codemirror/@nextjournal/clojure-mode.js"),
          import("./vendor/codemirror/@replit/codemirror-vim.js"),
          import("./vendor/codemirror/@codemirror/theme-one-dark.js")
        ]);
        // Optional: @codemirror/autocomplete. Not vendored by default —
        // run bin/vendor.sh after adding it to bin/vendor-cm.mjs's ENTRIES
        // to enable. The editor still works without it; autocompletion is
        // just turned off.
        let autocomplete = null;
        try {
          autocomplete = await import("./vendor/codemirror/@codemirror/autocomplete@6.js");
        } catch (e) {}
        window.CM = {
          EditorView:          view.EditorView,
          EditorState:         state.EditorState,
          Prec:                state.Prec,
          keymap:              view.keymap,
          lineNumbers:         view.lineNumbers,
          drawSelection:       view.drawSelection,
          highlightActiveLine: view.highlightActiveLine,
          history:             commands.history,
          defaultKeymap:       commands.defaultKeymap,
          historyKeymap:       commands.historyKeymap,
          indentSelection:     commands.indentSelection,
          bracketMatching:     language.bracketMatching,
          syntaxHighlighting:  language.syntaxHighlighting,
          defaultHighlightStyle: language.defaultHighlightStyle,
          defaultExtensions:   cljs.default_extensions,
          // cljs.syntax() — Clojure language definition only, no paredit
          // close-bracket keymap or format-on-change transaction filter.
          // Used when paredit is toggled off in the UI; we still want
          // syntax highlighting and indent rules.
          cljSyntax:           cljs.syntax,
          completeKeymap:      cljs.complete_keymap,
          vim:                 vim.vim,
          oneDark:             oneDark.oneDark,
          autocompletion:      autocomplete?.autocompletion,
          completionKeymap:    autocomplete?.completionKeymap
        };
      })();
    </script>
    <style>
      /* === Design tokens =============================================== */

      :root {
        /* Light theme (default) */
        --bg:               #fafafa;
        --surface:          #ffffff;
        --surface-2:        #f6f8fa;
        --surface-3:        #eef1f4;
        --border:           #d0d7de;
        --border-soft:      #eaeef2;
        --text:             #1f2933;
        --text-muted:       #57606a;
        --err:              #b42318;

        --tab-bg:           #ffffff;
        --tab-bg-hover:     #f6f8fa;
        --tab-active-bg:    #ddeeff;
        --tab-active-fg:    #0969da;
        --tab-active-bd:    #b6dafc;

        --action-bg:        #1f883d;
        --action-bg-hover:  #1a7f37;
        --action-fg:        #ffffff;

        --header-bg:        #1f2933;
        --header-fg:        #ffffff;

        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono",
                     Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg:               #0d1117;
          --surface:          #161b22;
          --surface-2:        #1c2129;
          --surface-3:        #21262d;
          --border:           #30363d;
          --border-soft:      #21262d;
          --text:             #e6edf3;
          --text-muted:       #8b949e;
          --err:              #ff7b72;

          --tab-bg:           #1c2129;
          --tab-bg-hover:     #21262d;
          --tab-active-bg:    #1f3a5c;
          --tab-active-fg:    #79c0ff;
          --tab-active-bd:    #1f6feb;

          --action-bg:        #238636;
          --action-bg-hover:  #2ea043;
          --action-fg:        #ffffff;

          --header-bg:        #161b22;
          --header-fg:        #e6edf3;
        }
      }


      /* === Document shell ============================================== */

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
      }

      /* 100% (not 100vh): keeps the height chain consistent with html/body
         so Firefox doesn't compute the column-flex root any taller than
         the viewport, which would push the bottom of the result pane out
         of view. */
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
      }


      /* === Header ====================================================== */

      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0.5rem 1rem;
        background: var(--header-bg);
        color: var(--header-fg);
      }
      header h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }
      header h1 canvas.logo-cycle {
        display: block;
        height: 28px;
        width: auto;
      }
      header .tagline {
        font-size: 0.75rem;
        opacity: 0.7;
      }
      header .header-right {
        display: flex;
        align-items: baseline;
        gap: 1rem;
      }
      header .header-links {
        display: flex;
        gap: 0.85rem;
        font-size: 0.75rem;
      }
      header .header-links a {
        color: var(--header-fg);
        text-decoration: none;
        opacity: 0.55;
        transition: opacity 0.15s ease;
      }
      header .header-links a:hover { opacity: 1; }


      /* === Pane layout ================================================= */

      .panes {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .pane + .pane { border-left: 1px solid var(--border); }
      .pane > .label {
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        background: var(--surface-3);
        border-bottom: 1px solid var(--border);
      }


      /* === Editor host & result pane (both scroll) ===================== */

      .cm-host,
      .result {
        flex: 1;
        min-height: 0;
        overflow: auto;
        font-family: var(--font-mono);
        font-size: 13px;
        line-height: 1.5;
      }

      .cm-host { background: var(--surface); }
      .cm-host .cm-editor { height: 100%; outline: none; }
      .cm-host .cm-editor.cm-focused { outline: none; }
      .cm-host .cm-content {
        padding: 0.75rem 1rem;
        color: var(--text);
      }

      /* padding-bottom is roomier than the other sides: Firefox doesn't
         include an overflow:auto element's padding-bottom in its
         scrollable area, so users couldn't scroll all the way to the
         last row of long output. The extra room makes the buffer
         visible past the bug. */
      .result {
        padding: 0.75rem 1rem 2rem;
        background: var(--surface);
        color: var(--text);
        white-space: pre-wrap;
      }
      .result .err  { color: var(--err); }
      .result .tex  { font-family: inherit; font-size: 1rem; }

      .result-row {
        padding: 0.4rem 0;
        border-bottom: 1px solid var(--border-soft);
      }
      .result-row:first-child { padding-top: 0; }
      .result-row:last-child  {
        padding-bottom: 0;
        border-bottom: 0;
      }

      .form-snippet,
      .pr {
        font-family: var(--font-mono);
      }
      .form-snippet {
        margin: 0 0 0.35rem 0;
        padding: 0.2rem 0.5rem;
        font-size: 0.7rem;
        color: var(--text-muted);
        background: var(--surface-2);
        border-radius: 3px;
        white-space: pre-wrap;
        overflow-x: auto;
      }
      .result-row .pr {
        margin-top: 0.3rem;
        font-size: 13px;
        color: var(--text-muted);
      }
      .form-snippet .hljs,
      .pr .hljs {
        display: inline;
        padding: 0;
        background: transparent;
      }


      /* === Inline visualization (Mafs etc.) ============================
         Plot background stays light so curves stay legible regardless of
         OS theme. */

      .viz {
        margin: 0.4rem 0;
        min-height: 240px;
        max-height: 60vh;
        overflow: hidden;
        border-radius: 4px;
        background: #ffffff;
      }
      .viz .MafsView { width: 100%; }


      /* === Toolbar ===================================================== */

      .toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.5rem 0.75rem;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
      }


      /* === Buttons ===================================================== */

      /* Filled accent — clearly an action you press. */
      button.action {
        font: inherit;
        padding: 0.25rem 0.75rem;
        background: var(--action-bg);
        color: var(--action-fg);
        border: 0;
        border-radius: 4px;
        cursor: pointer;
      }
      button.action:hover { background: var(--action-bg-hover); }

      /* Generic outlined button (page tabs, shelf toggle, permalink).
         Outlined in the active blue so all clickables read as one family;
         fill kicks in only when toggled on. */
      button.btn {
        font: inherit;
        font-size: 0.75rem;
        padding: 0.15rem 0.55rem;
        background: var(--tab-bg);
        color: var(--text);
        border: 1px solid var(--tab-active-bd);
        border-radius: 4px;
        cursor: pointer;
      }
      button.btn:hover { background: var(--tab-bg-hover); }
      button.btn.is-on {
        background: var(--tab-active-bg);
        color: var(--tab-active-fg);
      }

      /* Float the permalink button to the right of the toolbar.
         Class deliberately not "share-btn" — common content blockers
         (uBlock cosmetic filters, Safari content blockers) hide that
         class assuming it's a social-share widget. */
      .permalink-btn { margin-left: auto; }


      /* === Vim toggle (semantic checkbox) ============================== */

      label.check {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.15rem 0.25rem;
        font-size: 0.75rem;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }
      label.check input {
        margin: 0;
        cursor: pointer;
      }


      /* === Page tabs =================================================== */

      .pages {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.25rem;
        padding: 0.35rem 0.75rem;
        background: var(--surface-2);
        border-bottom: 1px solid var(--border);
      }
      .pages .page {
        display: inline-flex;
        align-items: center;
        padding: 0.1rem 0.5rem;
        font-size: 0.75rem;
        background: var(--tab-bg);
        color: var(--text);
        border: 1px solid var(--tab-active-bd);
        border-radius: 4px;
        user-select: none;
      }
      .pages .page:hover { background: var(--tab-bg-hover); }
      .pages .page.active {
        background: var(--tab-active-bg);
        color: var(--tab-active-fg);
        cursor: default;
      }
      .pages .page.active:hover { background: var(--tab-active-bg); }
      .pages .page-name { cursor: pointer; }
      .pages .page.active .page-name { cursor: default; }
      .pages .page-x {
        margin-left: 0.4rem;
        font-weight: bold;
        opacity: 0.55;
        cursor: pointer;
      }
      .pages .page-x:hover { opacity: 1; }
      .pages .page-add {
        padding: 0.1rem 0.55rem;
        font-size: 0.75rem;
        color: var(--tab-active-fg);
        background: transparent;
        border: 1px dashed var(--tab-active-bd);
        border-radius: 4px;
        cursor: pointer;
      }
      .pages .page-add:hover { background: var(--tab-bg-hover); }


      /* === System pages dropdown =======================================
         Sits at the left of the page tabs row. Visually a .page tab;
         clicking opens a small menu. */

      .system-dropdown {
        position: relative;
        display: inline-block;
      }
      .system-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 10;
        min-width: 140px;
        max-height: 60vh;
        overflow-y: auto;
        padding: 0.15rem 0;
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--tab-active-bd);
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      }
      .system-menu-item {
        padding: 0.25rem 0.65rem;
        font-size: 0.75rem;
        white-space: nowrap;
        cursor: pointer;
      }
      .system-menu-item:hover {
        background: var(--tab-bg-hover);
        color: var(--tab-active-fg);
      }


      /* === SICM → Emmy translator shelf =============================== */

      .shelf {
        display: flex;
        flex-direction: column;
        flex: 0 1 auto;
        min-height: 0;
        max-height: 50%;
        background: var(--surface-2);
        border-top: 1px solid var(--border);
      }
      .shelf-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.4rem 0.75rem;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
      }
      .shelf-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text);
      }
      .shelf-close {
        padding: 0 0.25rem;
        font-size: 1.25rem;
        line-height: 1;
        color: var(--text-muted);
        background: none;
        border: 0;
        cursor: pointer;
      }
      .shelf-kind {
        font: inherit;
        font-size: 0.75rem;
        padding: 0.1rem 0.3rem;
        background: var(--tab-bg);
        color: var(--text);
        border: 1px solid var(--tab-active-bd);
        border-radius: 4px;
        cursor: pointer;
      }
      .shelf-body {
        display: flex;
        flex: 1;
        min-height: 140px;
      }
      .shelf-pane {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
      }
      .shelf-pane + .shelf-pane {
        border-left: 1px solid var(--border);
      }
      .shelf-sublabel {
        padding: 0.2rem 0.6rem;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        background: var(--surface-3);
        border-bottom: 1px solid var(--border);
      }
      .shelf-textarea {
        flex: 1;
        min-height: 100px;
        padding: 0.5rem 0.75rem;
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.5;
        background: var(--surface);
        color: var(--text);
        border: 0;
        outline: none;
        resize: none;
        tab-size: 2;
      }
      .shelf-toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.4rem 0.75rem;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }
      .shelf-toolbar .hint {
        font-size: 0.7rem;
        color: var(--text-muted);
      }


      /* === Toast notification ========================================== */

      .toast {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 100;
        padding: 0.5rem 0.85rem;
        font-size: 0.8rem;
        background: var(--header-bg);
        color: var(--header-fg);
        border-radius: 4px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
        animation: toast-in 0.18s ease-out;
      }
      @keyframes toast-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0);   }
      }


      /* === Inline kbd ================================================== */

      kbd {
        padding: 1px 4px;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- React must load before scittle.reagent (shadow externalizes it as a global) -->
    <script src="vendor/react/react.production.min.js"></script>
    <script src="vendor/react/react-dom.production.min.js"></script>
    <!-- Stock scittle + reagent + pprint built locally by `bb release` -->
    <script src="js/scittle.js"></script>
    <script src="js/scittle.pprint.js"></script>
    <script src="js/scittle.reagent.js"></script>
    <!-- Our custom plugin: Emmy in SCI -->
    <script src="js/scittle.emmy.js"></script>
    <!-- KaTeX for rendering Emmy's TeX output -->
    <script defer src="vendor/katex/katex.min.js"></script>

    <!-- Application code: the playground UI itself, evaluated by Scittle -->
    <script type="application/x-scittle" src="app.cljs"></script>
  </body>
</html>
