<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emmy in the Browser — SICM Playground</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- highlight.js for syntax highlighting in the result pane -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- Clojure isn't in hljs's "common" bundle; load it explicitly. -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/clojure.min.js"></script>

    <!-- SICM (Scheme) → Emmy (Clojure) translator, exposes window.SicmToEmmy -->
    <script src="sicm2emmy.js"></script>

    <!-- CodeMirror 6 + nextjournal/clojure-mode loaded via esm.sh.
         The "codemirror" meta-package's basicSetup didn't survive esm.sh's
         wrapper, so we import the constituent @codemirror/* packages
         directly and compose our own setup. -->
    <script type="module">
      window.cm_ready = (async () => {
        const [view, state, commands, language, cljs, vim] = await Promise.all([
          import("https://esm.sh/@codemirror/view@6"),
          import("https://esm.sh/@codemirror/state@6"),
          import("https://esm.sh/@codemirror/commands@6"),
          import("https://esm.sh/@codemirror/language@6"),
          import("https://esm.sh/@nextjournal/clojure-mode"),
          import("https://esm.sh/@replit/codemirror-vim")
        ]);
        window.CM = {
          EditorView:          view.EditorView,
          EditorState:         state.EditorState,
          Prec:                state.Prec,
          keymap:              view.keymap,
          lineNumbers:         view.lineNumbers,
          drawSelection:       view.drawSelection,
          highlightActiveLine: view.highlightActiveLine,
          history:             commands.history,
          defaultKeymap:       commands.defaultKeymap,
          historyKeymap:       commands.historyKeymap,
          bracketMatching:     language.bracketMatching,
          defaultExtensions:   cljs.default_extensions,
          completeKeymap:      cljs.complete_keymap,
          vim:                 vim.vim
        };
      })();
    </script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: #fafafa;
        color: #222;
      }
      #app { height: 100vh; display: flex; flex-direction: column; }
      header {
        padding: 0.5rem 1rem;
        background: #1f2933;
        color: #fff;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
      header .hint { font-size: 0.75rem; opacity: 0.75; }
      .panes { flex: 1; display: flex; min-height: 0; }
      .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .pane + .pane { border-left: 1px solid #d0d7de; }
      .pane > .label {
        padding: 0.25rem 0.75rem;
        font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
        color: #57606a; background: #eef1f4; border-bottom: 1px solid #d0d7de;
      }
      .cm-host, .result {
        flex: 1; min-height: 0; overflow: auto;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 13px; line-height: 1.5;
      }
      .cm-host { background: #fff; }
      .cm-host .cm-editor { height: 100%; outline: none; }
      .cm-host .cm-editor.cm-focused { outline: none; }
      .cm-host .cm-content { padding: 0.75rem 1rem; }
      .result { background: #fff; white-space: pre-wrap; padding: 0.75rem 1rem; }
      .result .err { color: #b42318; }
      .result .tex { font-family: inherit; font-size: 1rem; }
      .result-row {
        padding: 0.4rem 0; border-bottom: 1px solid #eaeef2;
      }
      .result-row:first-child { padding-top: 0; }
      .result-row:last-child  { padding-bottom: 0; border-bottom: 0; }
      .form-snippet {
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 0.7rem; color: #57606a; background: #f6f8fa;
        padding: 0.2rem 0.5rem; margin: 0 0 0.35rem 0;
        border-radius: 3px; white-space: pre-wrap; overflow-x: auto;
      }
      .result-row .pr { color: #57606a; margin-top: 0.3rem; }
      .toolbar {
        padding: 0.5rem 0.75rem; border-top: 1px solid #d0d7de;
        display: flex; gap: 0.5rem; background: #f6f8fa;
      }
      button {
        font: inherit; padding: 0.25rem 0.75rem; cursor: pointer;
        background: #1f883d; color: #fff; border: 0; border-radius: 4px;
      }
      button:hover { background: #1a7f37; }
      kbd {
        font-family: ui-monospace, monospace; font-size: 0.75rem;
        padding: 1px 4px; border: 1px solid #d0d7de; border-radius: 3px;
        background: #f6f8fa;
      }
      .pages {
        display: flex; flex-wrap: wrap; gap: 0.25rem;
        padding: 0.35rem 0.75rem;
        background: #f6f8fa; border-bottom: 1px solid #d0d7de;
      }
      .pages .page {
        display: inline-flex; align-items: center;
        padding: 0.1rem 0.5rem; border: 1px solid #d0d7de; border-radius: 4px;
        background: #fff; font-size: 0.75rem; user-select: none;
      }
      .pages .page.active { background: #1f883d; color: #fff; border-color: #1a7f37; }
      .pages .page-name { cursor: pointer; }
      .pages .page-x {
        margin-left: 0.4rem; cursor: pointer; opacity: 0.55; font-weight: bold;
      }
      .pages .page-x:hover { opacity: 1; }
      .pages .page-add {
        padding: 0.1rem 0.55rem; font-size: 0.75rem;
        background: transparent; color: #57606a;
        border: 1px dashed #c0c8d0; border-radius: 4px; cursor: pointer;
      }
      .pages .page-add:hover { background: #fff; color: #1f883d; }

      /* SICM → Emmy translator shelf */
      .shelf {
        display: flex; flex-direction: column;
        max-height: 50%; flex-shrink: 0;
        border-bottom: 1px solid #d0d7de; background: #f6f8fa;
      }
      .shelf-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 0.4rem 0.75rem;
        background: #fff; border-bottom: 1px solid #d0d7de;
      }
      .shelf-title { font-size: 0.75rem; font-weight: 600; color: #1f2933; }
      .shelf-close {
        background: none; border: 0; font-size: 1.25rem; line-height: 1;
        cursor: pointer; color: #57606a; padding: 0 0.25rem;
      }
      .shelf-body { display: flex; flex: 1; min-height: 140px; }
      .shelf-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .shelf-pane + .shelf-pane { border-left: 1px solid #d0d7de; }
      .shelf-sublabel {
        padding: 0.2rem 0.6rem;
        font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em;
        color: #57606a; background: #eef1f4; border-bottom: 1px solid #d0d7de;
      }
      .shelf-textarea {
        flex: 1; min-height: 100px;
        border: 0; outline: none; padding: 0.5rem 0.75rem;
        font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px;
        line-height: 1.5; background: #fff; resize: none; tab-size: 2;
      }
      .shelf-toolbar {
        display: flex; gap: 0.75rem; align-items: center;
        padding: 0.4rem 0.75rem;
        background: #fff; border-top: 1px solid #d0d7de;
      }
      .shelf-toolbar .hint { font-size: 0.7rem; color: #57606a; }
      .shelf-toggle {
        margin-left: 0.5rem;
        padding: 0.25rem 0.6rem; font-size: 0.75rem;
        background: transparent; color: #57606a;
        border: 1px dashed #c0c8d0; border-radius: 4px; cursor: pointer;
      }
      .shelf-toggle:hover { background: #fff; color: #1f883d; }
      .shelf-toggle.active {
        background: #1f883d; color: #fff;
        border: 1px solid #1a7f37;
      }

      /* Tweaks for highlighted code in the result pane */
      .form-snippet, .pr {
        font-family: ui-monospace, SFMono-Regular, monospace;
      }
      .form-snippet .hljs, .pr .hljs {
        background: transparent; padding: 0; display: inline;
      }
      .pr .hljs { font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- React must load before scittle.reagent (shadow externalizes it as a global) -->
    <script crossorigin
            src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin
            src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Stock scittle + reagent + pprint built locally by `bb release` -->
    <script src="js/scittle.js"></script>
    <script src="js/scittle.pprint.js"></script>
    <script src="js/scittle.reagent.js"></script>
    <!-- Our custom plugin: Emmy in SCI -->
    <script src="js/scittle.emmy.js"></script>
    <!-- KaTeX for rendering Emmy's TeX output -->
    <script defer
            src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <!-- Application code: the playground UI itself, evaluated by Scittle -->
    <script type="application/x-scittle" src="app.cljs"></script>
  </body>
</html>
